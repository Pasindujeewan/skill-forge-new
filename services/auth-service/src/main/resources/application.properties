
server.port=8081


spring.application.name=auth-service


eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/skillforge_auth}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=900000

services.user-service.base-url=${USER_SERVICE_URL:http://user-service}
